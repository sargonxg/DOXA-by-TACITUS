<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Versioned reviewed learning with evaluation and rollback</title><desc id="desc">Human adjudication produces approved examples. A frozen snapshot is evaluated against a baseline on held-out material before explicit activation, with rollback.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#698876" stroke-width="1.4"/></marker></defs><rect width="1000" height="360" rx="8" fill="#f5f7f0"/><g font-family="Arial, sans-serif" fill="#204b3b"><text x="30" y="35" font-size="20" fill="#204b3b" font-weight="700">Project memory changes only through explicit review</text><rect x="30" y="80" width="214" height="141" rx="4" fill="#fff" stroke="#bdcdbb"/><text x="45" y="105" font-size="11" fill="#8a7049" font-weight="700">01</text><text x="45" y="129" font-size="16" fill="#204b3b" font-weight="700">Adjudicate</text><text x="45" y="154" font-size="13" fill="#536c5c" font-weight="400">Human corrections</text><text x="45" y="175" font-size="13" fill="#536c5c" font-weight="400">Approved examples</text><path d="M246 150L269 150" fill="none" stroke="#698876" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="272" y="80" width="214" height="141" rx="4" fill="#fff" stroke="#bdcdbb"/><text x="287" y="105" font-size="11" fill="#8a7049" font-weight="700">02</text><text x="287" y="129" font-size="16" fill="#204b3b" font-weight="700">Freeze</text><text x="287" y="154" font-size="13" fill="#536c5c" font-weight="400">Versioned snapshot</text><text x="287" y="175" font-size="13" fill="#536c5c" font-weight="400">Stable identifiers</text><path d="M488 150L511 150" fill="none" stroke="#698876" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="514" y="80" width="214" height="141" rx="4" fill="#fff" stroke="#bdcdbb"/><text x="529" y="105" font-size="11" fill="#8a7049" font-weight="700">03</text><text x="529" y="129" font-size="16" fill="#204b3b" font-weight="700">Evaluate</text><text x="529" y="154" font-size="13" fill="#536c5c" font-weight="400">Held-out comparison</text><text x="529" y="175" font-size="13" fill="#536c5c" font-weight="400">Baseline + candidate</text><path d="M730 150L753 150" fill="none" stroke="#698876" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="756" y="80" width="214" height="141" rx="4" fill="#fff" stroke="#bdcdbb"/><text x="771" y="105" font-size="11" fill="#8a7049" font-weight="700">04</text><text x="771" y="129" font-size="16" fill="#204b3b" font-weight="700">Activate</text><text x="771" y="154" font-size="13" fill="#536c5c" font-weight="400">Explicit decision</text><text x="771" y="175" font-size="13" fill="#536c5c" font-weight="400">Rollback available</text><path d="M863 224L863 273L381 273L381 225" fill="none" stroke="#ad814b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="455" y="297" font-size="13" fill="#8a7049" font-weight="400">Roll back to a previous approved method</text><text x="30" y="332" font-size="13" fill="#667a69" font-weight="400">Reviewed examples are project-scoped context. Model weights are not automatically retrained.</text></g></svg>
