<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Publication-time trajectory and assessment-time history</title><desc id="desc">Publication windows describe the source corpus; run and review timestamps describe assessments. They use different time axes and disclose source scope, method and coverage.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#698876" stroke-width="1.4"/></marker></defs><rect width="1000" height="360" rx="8" fill="#f5f7f0"/><g font-family="Arial, sans-serif" fill="#204b3b"><text x="30" y="35" font-size="20" fill="#204b3b" font-weight="700">Two clocks, two different research questions</text><text x="32" y="88" font-size="12" fill="#4e788d" font-weight="700">DISCOURSE TRAJECTORY</text><text x="32" y="113" font-size="15" fill="#204b3b" font-weight="400">When were the sources published?</text><path d="M355 110L950 110" fill="none" stroke="#698876" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="390" cy="110" r="6" fill="#4e788d"/><text x="354" y="145" font-size="13" fill="#204b3b" font-weight="400">Window A</text><circle cx="625" cy="110" r="6" fill="#4e788d"/><text x="589" y="145" font-size="13" fill="#204b3b" font-weight="400">Window B</text><circle cx="850" cy="110" r="6" fill="#4e788d"/><text x="814" y="145" font-size="13" fill="#204b3b" font-weight="400">Window C</text><text x="32" y="208" font-size="12" fill="#8a7049" font-weight="700">ASSESSMENT HISTORY</text><text x="32" y="233" font-size="15" fill="#204b3b" font-weight="400">When was the evidence assessed or reviewed?</text><path d="M355 230L950 230" fill="none" stroke="#698876" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="385" y="225" width="10" height="10" fill="#ad814b"/><text x="365" y="265" font-size="13" fill="#204b3b" font-weight="400">Run 1</text><rect x="620" y="225" width="10" height="10" fill="#ad814b"/><text x="600" y="265" font-size="13" fill="#204b3b" font-weight="400">Review</text><rect x="845" y="225" width="10" height="10" fill="#ad814b"/><text x="825" y="265" font-size="13" fill="#204b3b" font-weight="400">Run 2</text><path d="M30 294L970 294" fill="none" stroke="#698876" stroke-width="1.6"/><text x="32" y="321" font-size="13" fill="#204b3b" font-weight="400">Compare with source scope, method and coverage visible. Keep document changes separate from assessment changes.</text><text x="32" y="344" font-size="12" fill="#667a69" font-weight="400">Schematic only: no measured trend or model-improvement claim is shown.</text></g></svg>
