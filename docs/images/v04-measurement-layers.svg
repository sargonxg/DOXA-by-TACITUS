<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 275" role="img" aria-labelledby="title desc"><title id="title">measurement layers</title><desc id="desc">Methodological schematic. Origins and boundaries remain separate; no measured performance or accuracy is implied.</desc><rect width="1000" height="275" fill="#f1f4ec"/><rect x="15" y="44" width="178" height="173" rx="8" fill="#204d3a"/><text x="28" y="75" font-family="sans-serif" font-size="13" fill="#e3dfb5">SOURCE</text><text x="28" y="112" font-family="sans-serif" font-size="15" fill="#ffffff">Preserved words</text><text x="28" y="151" font-family="sans-serif" font-size="12" fill="#ffffff">Original author /</text><text x="28" y="170" font-family="sans-serif" font-size="12" fill="#ffffff">rights</text><path d="M 196 124 h 13 l -4 -4 m 4 4 l -4 4" stroke="#6d7d4f" fill="none" stroke-width="2"/><rect x="213" y="44" width="178" height="173" rx="8" fill="#365d68"/><text x="226" y="75" font-family="sans-serif" font-size="13" fill="#e3dfb5">FRAMEWORK</text><text x="226" y="112" font-family="sans-serif" font-size="15" fill="#ffffff">Named criterion</text><text x="226" y="151" font-family="sans-serif" font-size="12" fill="#ffffff">Conditions /</text><text x="226" y="170" font-family="sans-serif" font-size="12" fill="#ffffff">exclusions</text><path d="M 394 124 h 13 l -4 -4 m 4 4 l -4 4" stroke="#6d7d4f" fill="none" stroke-width="2"/><rect x="411" y="44" width="178" height="173" rx="8" fill="#204d3a"/><text x="424" y="75" font-family="sans-serif" font-size="13" fill="#e3dfb5">MODEL</text><text x="424" y="112" font-family="sans-serif" font-size="15" fill="#ffffff">Recorded outcome</text><text x="424" y="151" font-family="sans-serif" font-size="12" fill="#ffffff">No accuracy implied</text><path d="M 592 124 h 13 l -4 -4 m 4 4 l -4 4" stroke="#6d7d4f" fill="none" stroke-width="2"/><rect x="609" y="44" width="178" height="173" rx="8" fill="#365d68"/><text x="622" y="75" font-family="sans-serif" font-size="13" fill="#e3dfb5">REVIEW</text><text x="622" y="112" font-family="sans-serif" font-size="15" fill="#ffffff">Actual judgments</text><text x="622" y="151" font-family="sans-serif" font-size="12" fill="#ffffff">Pending if absent</text><path d="M 790 124 h 13 l -4 -4 m 4 4 l -4 4" stroke="#6d7d4f" fill="none" stroke-width="2"/><rect x="807" y="44" width="178" height="173" rx="8" fill="#204d3a"/><text x="820" y="75" font-family="sans-serif" font-size="13" fill="#e3dfb5">EDITORIAL</text><text x="820" y="112" font-family="sans-serif" font-size="15" fill="#ffffff">Reading questions</text><text x="820" y="151" font-family="sans-serif" font-size="12" fill="#ffffff">AI guidance /</text><text x="820" y="170" font-family="sans-serif" font-size="12" fill="#ffffff">separate</text><text x="18" y="252" font-family="sans-serif" font-size="12" fill="#365744">Schematic only · Source integrity, model interpretation and independent review are different evidence.</text></svg>