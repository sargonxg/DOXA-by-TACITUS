<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 275" role="img" aria-labelledby="title desc"><title id="title">attribution chain</title><desc id="desc">Methodological schematic. Origins and boundaries remain separate; no measured performance or accuracy is implied.</desc><rect width="1000" height="275" fill="#f1f4ec"/><rect x="15" y="44" width="178" height="173" rx="8" fill="#204d3a"/><text x="28" y="75" font-family="sans-serif" font-size="13" fill="#e3dfb5">DOCUMENT</text><text x="28" y="112" font-family="sans-serif" font-size="15" fill="#ffffff">Author of review</text><text x="28" y="151" font-family="sans-serif" font-size="12" fill="#ffffff">Containing voice</text><path d="M 196 124 h 13 l -4 -4 m 4 4 l -4 4" stroke="#6d7d4f" fill="none" stroke-width="2"/><rect x="213" y="44" width="178" height="173" rx="8" fill="#365d68"/><text x="226" y="75" font-family="sans-serif" font-size="13" fill="#e3dfb5">REPORT</text><text x="226" y="112" font-family="sans-serif" font-size="15" fill="#ffffff">Reported source</text><text x="226" y="151" font-family="sans-serif" font-size="12" fill="#ffffff">Not the byline</text><path d="M 394 124 h 13 l -4 -4 m 4 4 l -4 4" stroke="#6d7d4f" fill="none" stroke-width="2"/><rect x="411" y="44" width="178" height="173" rx="8" fill="#204d3a"/><text x="424" y="75" font-family="sans-serif" font-size="13" fill="#e3dfb5">POST</text><text x="424" y="112" font-family="sans-serif" font-size="15" fill="#ffffff">Shares material</text><text x="424" y="151" font-family="sans-serif" font-size="12" fill="#ffffff">May relay a video</text><path d="M 592 124 h 13 l -4 -4 m 4 4 l -4 4" stroke="#6d7d4f" fill="none" stroke-width="2"/><rect x="609" y="44" width="178" height="173" rx="8" fill="#365d68"/><text x="622" y="75" font-family="sans-serif" font-size="13" fill="#e3dfb5">VIDEO</text><text x="622" y="112" font-family="sans-serif" font-size="15" fill="#ffffff">Inner expression</text><text x="622" y="151" font-family="sans-serif" font-size="12" fill="#ffffff">Speaker may be</text><text x="622" y="170" font-family="sans-serif" font-size="12" fill="#ffffff">unknown</text><path d="M 790 124 h 13 l -4 -4 m 4 4 l -4 4" stroke="#6d7d4f" fill="none" stroke-width="2"/><rect x="807" y="44" width="178" height="173" rx="8" fill="#204d3a"/><text x="820" y="75" font-family="sans-serif" font-size="13" fill="#e3dfb5">RELATION</text><text x="820" y="112" font-family="sans-serif" font-size="15" fill="#ffffff">Proposition / stance</text><text x="820" y="151" font-family="sans-serif" font-size="12" fill="#ffffff">Adoption ≠ presence</text><text x="18" y="252" font-family="sans-serif" font-size="12" fill="#365744">Schematic only · Source integrity, model interpretation and independent review are different evidence.</text></svg>