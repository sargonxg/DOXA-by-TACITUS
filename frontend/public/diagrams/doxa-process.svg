<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">The DOXA research process</title><desc id="desc">Import, define, assess, review and compare. Source versions, passages, criteria, model profiles and review history remain connected.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#698876" stroke-width="1.4"/></marker></defs><rect width="1000" height="360" rx="8" fill="#f5f7f0"/><g font-family="Arial, sans-serif" fill="#204b3b"><text x="30" y="35" font-size="20" fill="#204b3b" font-weight="700">A declared method, carried from source to report</text><rect x="30" y="85" width="172" height="139" rx="4" fill="#fff" stroke="#bdcdbb"/><text x="45" y="110" font-size="11" fill="#8a7049" font-weight="700">01</text><text x="45" y="134" font-size="16" fill="#204b3b" font-weight="700">Import</text><text x="45" y="159" font-size="13" fill="#536c5c" font-weight="400">Sources + metadata</text><text x="45" y="180" font-size="13" fill="#536c5c" font-weight="400">Preserved originals</text><path d="M204 155L219 155" fill="none" stroke="#698876" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="222" y="85" width="172" height="139" rx="4" fill="#fff" stroke="#bdcdbb"/><text x="237" y="110" font-size="11" fill="#8a7049" font-weight="700">02</text><text x="237" y="134" font-size="16" fill="#204b3b" font-weight="700">Define</text><text x="237" y="159" font-size="13" fill="#536c5c" font-weight="400">Question + lens</text><text x="237" y="180" font-size="13" fill="#536c5c" font-weight="400">Model + budget</text><path d="M396 155L411 155" fill="none" stroke="#698876" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="414" y="85" width="172" height="139" rx="4" fill="#fff" stroke="#bdcdbb"/><text x="429" y="110" font-size="11" fill="#8a7049" font-weight="700">03</text><text x="429" y="134" font-size="16" fill="#204b3b" font-weight="700">Assess</text><text x="429" y="159" font-size="13" fill="#536c5c" font-weight="400">Bounded passages</text><text x="429" y="180" font-size="13" fill="#536c5c" font-weight="400">Coverage + failures</text><path d="M588 155L603 155" fill="none" stroke="#698876" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="606" y="85" width="172" height="139" rx="4" fill="#fff" stroke="#bdcdbb"/><text x="621" y="110" font-size="11" fill="#8a7049" font-weight="700">04</text><text x="621" y="134" font-size="16" fill="#204b3b" font-weight="700">Review</text><text x="621" y="159" font-size="13" fill="#536c5c" font-weight="400">Quote + attribution</text><text x="621" y="180" font-size="13" fill="#536c5c" font-weight="400">Human judgment</text><path d="M780 155L795 155" fill="none" stroke="#698876" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="798" y="85" width="172" height="139" rx="4" fill="#fff" stroke="#bdcdbb"/><text x="813" y="110" font-size="11" fill="#8a7049" font-weight="700">05</text><text x="813" y="134" font-size="16" fill="#204b3b" font-weight="700">Compare</text><text x="813" y="159" font-size="13" fill="#536c5c" font-weight="400">Same scope</text><text x="813" y="180" font-size="13" fill="#536c5c" font-weight="400">Reports + history</text><path d="M30 275L970 275" fill="none" stroke="#698876" stroke-width="1.6"/><text x="34" y="305" font-size="14" fill="#204b3b" font-weight="400">Traceability: source version → exact passage → criterion → model profile → review → export snapshot</text><text x="34" y="330" font-size="12" fill="#667a69" font-weight="400">A valid citation locates words. It does not establish a correct interpretation.</text></g></svg>
