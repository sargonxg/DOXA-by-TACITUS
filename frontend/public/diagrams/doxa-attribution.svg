<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Separate the document author from embedded speakers</title><desc id="desc">An institutional source can quote or invent a speaker for an example. Document stance and speaker stance require separate assessments and human review.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#698876" stroke-width="1.4"/></marker></defs><rect width="1000" height="360" rx="8" fill="#f5f7f0"/><g font-family="Arial, sans-serif" fill="#204b3b"><text x="30" y="35" font-size="20" fill="#204b3b" font-weight="700">One document can contain several voices</text><rect x="30" y="65" width="455" height="230" rx="5" fill="#e9efe4" stroke="#b4c7af"/><text x="50" y="94" font-size="16" fill="#204b3b" font-weight="700">Document author: public institution</text><text x="50" y="120" font-size="13" fill="#536c5c" font-weight="400">Explains rights, duties and exceptions</text><rect x="65" y="145" width="380" height="117" rx="4" fill="#fff" stroke="#bdcdbb"/><text x="80" y="174" font-size="16" fill="#204b3b" font-weight="700">Embedded speaker / hypothetical example</text><text x="80" y="199" font-size="13" fill="#536c5c" font-weight="400">A remark is quoted to explain a problem.</text><text x="80" y="220" font-size="13" fill="#536c5c" font-weight="400">Its presence does not establish endorsement.</text><path d="M485 145L540 115" fill="none" stroke="#698876" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M445 208L540 232" fill="none" stroke="#698876" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="550" y="65" width="420" height="100" rx="4" fill="#fff" stroke="#bdcdbb"/><text x="565" y="94" font-size="16" fill="#204b3b" font-weight="700">Document stance</text><text x="565" y="119" font-size="13" fill="#536c5c" font-weight="400">Protecting rights? Reporting? Rebutting?</text><text x="565" y="140" font-size="13" fill="#536c5c" font-weight="400">Check the surrounding institutional explanation.</text><rect x="550" y="185" width="420" height="100" rx="4" fill="#fff" stroke="#bdcdbb"/><text x="565" y="214" font-size="16" fill="#204b3b" font-weight="700">Speaker role and stance</text><text x="565" y="239" font-size="13" fill="#536c5c" font-weight="400">Who is represented, toward which target?</text><text x="565" y="260" font-size="13" fill="#536c5c" font-weight="400">Quoted, hypothetical, endorsed or uncertain?</text><text x="35" y="330" font-size="13" fill="#667a69" font-weight="400">SCHEMATIC EXAMPLE  ·  Read context, preserve ambiguity, then adjudicate attribution.</text></g></svg>
