[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doxa-by-tacitus"
version = "0.7.1"
description = "An evidence-centred, portable workbench for corpus and discourse research"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pydantic>=2.9,<3",
  "httpx>=0.27,<1", "python-multipart>=0.0.18,<1", "pdfminer.six>=20240706,<20280000", "pypdf>=5,<7",
  "beautifulsoup4>=4.12,<5", "python-docx>=1.1,<2", "xlsxwriter>=3.2,<4",
  "weasyprint>=70,<71", "reportlab>=4,<5", "python-dotenv>=1,<2", "cryptography>=44,<47"
]

[project.optional-dependencies]
cpu = ["transformers>=4.51,<6", "tokenizers>=0.21,<1", "safetensors>=0.5,<1", "numpy>=1.26,<3"]
cpu-lite = ["onnxruntime>=1.20,<2", "tokenizers>=0.21,<1", "numpy>=1.26,<3"]
legacy-pdf = ["pymupdf>=1.25,<2"]
publication = ["pypdfium2>=4,<6"]
ocr = ["docling>=2.0,<3"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "playwright>=1.50,<2"]

[project.scripts]
doxa = "doxa.cli:main"

[tool.setuptools.packages.find]
include = ["doxa*"]

[tool.setuptools.package-data]
doxa = ["*.sql", "static/*", "static/**/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
