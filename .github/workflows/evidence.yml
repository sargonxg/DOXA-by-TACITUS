name: Replay frozen evidence
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  full-corpus-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Check documentation and public artifact hashes
        run: python scripts/verify_repository.py
      - name: Restore every source and assessment, verify references, replay idempotently
        run: >-
          python scripts/verify_evidence_release.py --execute
          --expected-package-sha256 783432b8430aeadc0bcce665e897bba33d8b9a14f718f70f0c5a988c1e884827
          --receipt /tmp/doxa-evidence-replay.json
          --report-job-receipt /tmp/doxa-report-job-5000.json --max-temp-gib 8 --min-free-gib 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-replay-receipt
          path: |
            /tmp/doxa-evidence-replay.json
            /tmp/doxa-report-job-5000.json
          retention-days: 30
