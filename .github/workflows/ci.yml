name: Verify DOXA
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade 'pip>=26.2,<27'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infra/cloudflare/package-lock.json
      - run: npm ci
        working-directory: infra/cloudflare
      - run: npm run typecheck
        working-directory: infra/cloudflare
      - run: npm test
        working-directory: infra/cloudflare
        env:
          WRANGLER_SEND_METRICS: 'false'
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag doxa:ci .
      - run: |
          docker run -d --name doxa-ci -p 127.0.0.1:8000:8000 doxa:ci
          trap 'docker logs doxa-ci; docker rm -f doxa-ci' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 2
          done
          exit 1
