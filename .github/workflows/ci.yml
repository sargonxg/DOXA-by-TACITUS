name: Verify DOXA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade 'pip>=26.2,<27'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        with:
          name: compiled-workspace
          path: frontend/dist
          retention-days: 7
  lint-and-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check doxa scripts tests setup.py
      - run: python scripts/verify_repository.py
  browser:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/download-artifact@v8
        with:
          name: compiled-workspace
          path: frontend/dist
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_v3.py
      - run: python tests/browser_import_scope.py
      - run: python tests/browser_verification.py
      - run: python tests/browser_publications_v04.py
      - run: python tests/browser_report_jobs_v04.py
      - run: python tests/browser_accessibility_v04.py
  wheel:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/download-artifact@v8
        with:
          name: compiled-workspace
          path: frontend/dist
      - run: python -m pip install -e '.[dev]' wheel
      - run: python scripts/build_wheel.py
      - run: python scripts/check_wheel.py dist/doxa_by_tacitus-0.4.0-py3-none-any.whl
      - uses: actions/upload-artifact@v7
        with:
          name: application-wheel
          path: dist/*.whl
          retention-days: 14
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infra/cloudflare/package-lock.json
      - run: npm ci
        working-directory: infra/cloudflare
      - run: npm run typecheck
        working-directory: infra/cloudflare
      - run: npm test
        working-directory: infra/cloudflare
        env:
          WRANGLER_SEND_METRICS: 'false'
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag doxa:ci .
      - run: |
          docker run -d --name doxa-ci -p 127.0.0.1:8000:8000 doxa:ci
          trap 'docker logs doxa-ci; docker rm -f doxa-ci' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 2
          done
          exit 1
