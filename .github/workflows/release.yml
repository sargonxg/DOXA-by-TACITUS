name: Package DOXA release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag with prepared release notes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: doxa-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag name
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged source
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[dev]' wheel
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Qualify and package the release
        run: |
          test "$RELEASE_TAG" = "v$(python -c 'from doxa import __version__; print(__version__)')"
          python scripts/verify_repository.py
          python scripts/build_scorecard_example.py
          mkdir release
          python scripts/build_bias_study.py --offline-zip "release/doxa-${RELEASE_TAG#v}-offline-study.zip"
          python scripts/build_wheel.py --output release
          python scripts/check_wheel.py release/*.whl
          cp frontend/public/studies/muslim-coverage/{report.pdf,evidence.xlsx,evidence.jsonld,sources.zip} release/
          cp examples/muslim-coverage.manifest.json release/
          scorecard=frontend/public/studies/scorecard
          cp "$scorecard"/{doxa-scorecard.pdf,doxa-scorecard.xlsx,doxa-scorecard.csv,doxa-scorecard.jsonl,scorecard-evidence.jsonld} release/
          cp "$scorecard/starter.zip" "release/doxa-${RELEASE_TAG#v}-civic-square-inputs.zip"
          cp examples/scorecard.manifest.json release/
          if [[ -f scripts/build_antisemitism_case.py ]]; then
            python scripts/build_antisemitism_case.py --offline-zip "release/doxa-${RELEASE_TAG#v}-antisemitism-case.zip"
            case_assets=frontend/public/studies/antisemitism
            cp "$case_assets/antisemitism-case.pdf" examples/antisemitism-case.manifest.json release/
            cp "$case_assets/decisions.csv" release/antisemitism-decisions.csv
            cp "$case_assets/evidence.jsonld" release/antisemitism-evidence.jsonld
          fi
          cd release
          sha256sum * > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: doxa-release-files
          path: release/

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: doxa-release-files
          path: release
      - name: Upload release assets and publish
        run: |
          cd release
          sha256sum -c SHA256SUMS.txt
          existing=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for artifact in *; do
            if printf '%s\n' "$existing" | rg -Fxq -- "$artifact"; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$artifact" --dir "$RUNNER_TEMP"
              cmp "$artifact" "$RUNNER_TEMP/$artifact"
            else
              gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$artifact"
            fi
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
